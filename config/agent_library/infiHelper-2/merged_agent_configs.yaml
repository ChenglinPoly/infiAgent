        task_id:
          type: string
          description: 任务的唯一ID。
        task_input:
          type: string
          description: 具体的搜索任务要求，包括论文主题、关键词、数量要求等。
        max_turns:
          type: integer
          default: 100
          description: 搜索过程的最大轮次，防止无限循环。可选。
      required:
