temperature: 0
max_tokens: 0
max_context_window: 500000

base_url: https://openrouter.ai/api/v1
api_key: ""

timeout: 600
stream_timeout: 30
first_chunk_timeout: 30

tool_choice:
  execution: auto
  thinking: auto
  compressor: auto
  image_generation: auto
  read_figure: auto

models:
  - name: openrouter/qwen/qwen3.6-plus
    default: true
    tool_choice: auto

figure_models:
  - name: openrouter/qwen/qwen3.6-plus
    default: true
    tool_choice: auto

compressor_models:
  - name: openrouter/qwen/qwen3.6-plus
    default: true
    tool_choice: auto

thinking_models:
  - name: openrouter/qwen/qwen3.6-plus
    default: true
    tool_choice: auto

read_figure_models:
  - name: openrouter/qwen/qwen3.6-plus
    default: true
    tool_choice: auto

multimodal: true
compressor_multimodal: true

# ===== 多部署路由（3.12.21+，可选）=====
# 同一逻辑模型挂多平台/多密钥：健康时恒用第一个部署（保 prompt cache 命中），
# 失败自动冷却切换下一个，冷却到期自动切回主部署。老单密钥格式完全兼容。
